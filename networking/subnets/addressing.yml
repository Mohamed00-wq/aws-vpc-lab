# VPC Addressing Plan
# AWS VPC Lab - Cisco Packet Tracer

vpc:
  name: "AWS-VPC-Lab"
  cidr: "10.0.0.0/16"

availability_zones:
  az1:
    name: "AZ1"
    cidr: "10.0.0.0/20"
    subnets:
      public:
        name: "AZ1-Public"
        cidr: "10.0.0.0/24"
        gateway: "10.0.0.1"
        devices:
          - name: "AZ1-Router"
            ip: "10.0.0.1"
            role: "gateway"
          - name: "AZ1-NAT"
            ip: "10.0.0.2"
            role: "nat"
          - name: "AZ1-LB"
            ip: "10.0.0.10"
            role: "load-balancer"
      private_app:
        name: "AZ1-Private-App"
        cidr: "10.0.1.0/24"
        gateway: "10.0.1.1"
        devices:
          - name: "AZ1-Router"
            ip: "10.0.1.1"
            role: "gateway"
          - name: "AZ1-App-Server-1"
            ip: "10.0.1.10"
            role: "app-server"
          - name: "AZ1-App-Server-2"
            ip: "10.0.1.11"
            role: "app-server"
      private_db:
        name: "AZ1-Private-DB"
        cidr: "10.0.2.0/24"
